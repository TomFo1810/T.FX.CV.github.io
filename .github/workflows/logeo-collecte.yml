name: Logéo – collecte des annonces

# Relit les sources toutes les 30 minutes et publie le résultat sur la branche « logeo-data »,
# que le site lit directement. L'historique de la branche principale n'est pas touché.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: logeo-collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reprendre les données précédentes
        run: |
          mkdir -p sortie
          if git fetch --depth 1 origin logeo-data 2>/dev/null; then
            git show FETCH_HEAD:listings.json > sortie/precedent.json
          else
            cp logeo/data/listings.json sortie/precedent.json
          fi
      - name: Collecter
        run: node tools/logeo/collect.mjs --prev sortie/precedent.json --out sortie/publie/listings.json --pages 4
      - name: Publier sur la branche logeo-data
        run: |
          cd sortie/publie
          git init -q -b logeo-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add listings.json
          git commit -q -m "Annonces du $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" logeo-data
